server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: device-registry
              uri: http://localhost:8081
              predicates:
                - Path=/api/devices/**

            - id: telemetry-ingest
              uri: http://localhost:8082
              predicates:
                - Path=/api/telemetry/**

            - id: command-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/commands/**

          globalcors:
            cors-configurations:
              "[/**]":
                allowedOrigins:
                  - "http://localhost:5173"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - "*"
                allowCredentials: true
