version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: pulsefleet-postgres
    environment:
      POSTGRES_DB: pulsefleet
      POSTGRES_USER: pulsefleet
      POSTGRES_PASSWORD: pulsefleet123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsefleet"]
      interval: 10s
      timeout: 5s
      retries: 5
  emqx:
    image: emqx/emqx:5.5.0
    container_name: pulsefleet-emqx
    ports:
      - "1883:1883" # MQTT port
      - "8883:8083" # WebSocket port
      - "18083:18083" # Dashboard port
    environment:
      - EMQX_ALLOW_ANONYMOUS=true # Dev için, prod'da kapatılacak
      - EMQX_LISTENER__TCP__EXTERNAL=1883
    volumes:
      - emqx_data:/opt/emqx/data
    healthcheck:
      test: ["CMD", "emqx_ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
  emqx_data:
